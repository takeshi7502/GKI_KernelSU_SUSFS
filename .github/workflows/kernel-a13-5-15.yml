name: 内核构建 - Android 13 (5.15)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # Backward-compatible Bot API inputs. Branch selection follows upstream.
      kernelsu_branch:
        description: "Legacy branch label; retained for older bot clients"
        type: string
        required: false
        default: ""
      cancel_susfs:
        description: "Legacy switch: disable SUSFS while keeping KernelSU"
        type: boolean
        required: false
        default: false
      sub_levels:
        description: "Comma-separated sublevels; empty uses the upstream matrix"
        type: string
        required: false
        default: ""
      # ==================== 下拉选项 ====================
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - Official
          #- Next
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - BakaSU
          - ReSukiSU
          - KittiSU
        default: BakaSU
      ksu_mode:
        description: "KernelSU / SUSFS 模式"
        required: true
        type: choice
        options:
          - 关闭
          - 禁用SUSFS
          - 禁用KSU
        default: 关闭
      use_kpm:
        description: "KPM 功能（patched 尚不支持）"
        required: true
        type: choice
        default: "disabled (关闭)"
        options:
          - "disabled (关闭)"
          - "enabled (开启)"
          - "patched (开启并修补，尚不支持)"
          - "true"
          - "false"
      droidspaces:
        description: "Droidspaces 容器支持"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      artifact_upload_mode:
        description: "构建产物上传模式"
        required: true
        type: choice
        options:
          - "仅上传 AnyKernel3.zip"
          - "上传全部"
          - all
          - anykernel
        default: "仅上传 AnyKernel3.zip"

      # ==================== 文本输入 ====================
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      build_time:
        description: "自定义构建时间 (可选，N或留空=当前UTC)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

      # ==================== 开关（默认关闭） ====================
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      use_nomount:
        description: "启用 NoMount 挂载元模块"
        required: false
        type: boolean
        default: false
      use_networking:
        description: "启用网络增强（BBRv3 / IPSet / Qdisc / CIFS）"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链"
        required: false
        type: boolean
        default: false
      droidspaces_ntsync:
        description: "启用 Droidspaces 容器 NTSync 支持（需启用 Droidspaces）"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      kernelsu_branch:
        required: false
        type: string
        default: ""
      cancel_susfs:
        required: false
        type: boolean
        default: false
      sub_levels:
        required: false
        type: string
        default: ""
      kernelsu_variant:
        required: true
        type: string
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
      use_zram:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_kpm:
        required: true
        type: string
      use_rekernel:
        required: false
        type: boolean
        default: false
      use_nomount:
        required: false
        type: boolean
        default: false
      use_networking:
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      ksu_mode:
        required: false
        type: string
        default: 关闭
      droidspaces:
        required: false
        type: string
        default: "off"
      artifact_upload_mode:
        required: false
        type: string
        default: "上传全部"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      called_from_main:
        description: "是否从 main.yml 调用（内部使用）"
        required: false
        type: boolean
        default: false
      export_susfs_patches:
        description: "导出 SUSFS 集成补丁（由 main.yml 传入）"
        required: false
        type: boolean
        default: false

jobs:
  prepare-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        env:
          SUB_LEVELS: ${{ inputs.sub_levels }}
          ANDROID_VERSION: android13
          KERNEL_VERSION: "5.15"
          MATRIX_JSON: >-
            [
              {"sub_level":"74","os_patch_level":"2023-01"},
              {"sub_level":"78","os_patch_level":"2023-03"},
              {"sub_level":"94","os_patch_level":"2023-05"},
              {"sub_level":"104","os_patch_level":"2023-07"},
              {"sub_level":"119","os_patch_level":"2023-09"},
              {"sub_level":"123","os_patch_level":"2023-11"},
              {"sub_level":"137","os_patch_level":"2024-01"},
              {"sub_level":"144","os_patch_level":"2024-03"},
              {"sub_level":"148","os_patch_level":"2024-05"},
              {"sub_level":"149","os_patch_level":"2024-07"},
              {"sub_level":"151","os_patch_level":"2024-08"},
              {"sub_level":"153","os_patch_level":"2024-09"},
              {"sub_level":"167","os_patch_level":"2024-11"},
              {"sub_level":"170","os_patch_level":"2025-01"},
              {"sub_level":"178","os_patch_level":"2025-03"},
              {"sub_level":"180","os_patch_level":"2025-05"},
              {"sub_level":"185","os_patch_level":"2025-07"},
              {"sub_level":"189","os_patch_level":"2025-09"},
              {"sub_level":"194","os_patch_level":"2025-12"},
              {"sub_level":"X","os_patch_level":"lts"}
            ]
        run: python3 scripts/workflow_inputs.py matrix

  build-kernels-a13-5-15:
    name: "5.15.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android13"
      kernel_version: "5.15"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      ksu_variant: ${{ (inputs.kernelsu_variant == 'ReSukiSU' && 'BakaSU' || inputs.kernelsu_variant) }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      use_nomount: ${{ inputs.use_nomount || false }}
      use_networking: ${{ inputs.use_networking || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      export_susfs_patches: ${{ inputs.export_susfs_patches || false }}
      supp_op: false
      enable_susfs: ${{ (inputs.ksu_mode == '禁用KSU' && '禁用KSU' || (inputs.cancel_susfs || inputs.ksu_mode == '禁用SUSFS') && '禁用SUSFS' || '关闭') != '禁用SUSFS' && (inputs.ksu_mode == '禁用KSU' && '禁用KSU' || (inputs.cancel_susfs || inputs.ksu_mode == '禁用SUSFS') && '禁用SUSFS' || '关闭') != '禁用KSU' }}
      ksu_mode: ${{ (inputs.ksu_mode == '禁用KSU' && '禁用KSU' || (inputs.cancel_susfs || inputs.ksu_mode == '禁用SUSFS') && '禁用SUSFS' || '关闭') || '关闭' }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}

  # 仅在直接触发时运行，从 main.yml 调用时跳过
  get-ksu-manager:
    if: ${{ !inputs.called_from_main && (inputs.ksu_mode == '禁用KSU' && '禁用KSU' || (inputs.cancel_susfs || inputs.ksu_mode == '禁用SUSFS') && '禁用SUSFS' || '关闭') != '禁用KSU' }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ (inputs.kernelsu_variant == 'ReSukiSU' && 'BakaSU' || inputs.kernelsu_variant) }}
