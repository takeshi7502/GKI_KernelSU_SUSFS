name: Android 内核构建-自定义

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: "Legacy bot input; must match the selected kernel if supplied"
        type: string
        required: false
        default: ""
      # Backward-compatible Bot API inputs. Branch selection follows upstream.
      kernelsu_branch:
        description: "Legacy branch label; retained for older bot clients"
        type: string
        required: false
        default: ""
      cancel_susfs:
        description: "Legacy switch: disable SUSFS while keeping KernelSU"
        type: boolean
        required: false
        default: false
      sub_level:
        description: "Optional expected sublevel; must match os_patch_level (X for LTS)"
        type: string
        required: false
        default: ""
      revision:
        description: "Android 12 certified boot revision"
        type: string
        required: false
        default: "r1"
      # ==================== 下拉选项 ====================
      kernel_version:
        description: "内核版本"
        required: true
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"
        default: "5.10"
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - Official
          #- Next
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - BakaSU
          - ReSukiSU
          - KittiSU
        default: BakaSU
      ksu_mode:
        description: "KernelSU / SUSFS 模式"
        required: true
        type: choice
        options:
          - 关闭
          - 禁用SUSFS
          - 禁用KSU
        default: 关闭
      use_kpm:
        description: "KPM 功能（patched 尚不支持）"
        required: true
        type: choice
        default: "disabled (关闭)"
        options:
          - "disabled (关闭)"
          - "enabled (开启)"
          - "patched (开启并修补，尚不支持)"
          - "true"
          - "false"
      droidspaces:
        description: "Droidspaces 容器支持 (5.10~6.6: 槽位补丁, 6.12: 开/关)"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      artifact_upload_mode:
        description: "构建产物上传模式"
        required: true
        type: choice
        options:
          - "仅上传 AnyKernel3.zip"
          - "上传全部"
          - all
          - anykernel
        default: "仅上传 AnyKernel3.zip"

      # ==================== 文本输入 ====================
      os_patch_level:
        description: "安全补丁级别 (如 2022-01, lts)"
        required: true
        type: string
        default: "2022-01"
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      build_time:
        description: "自定义构建时间 (可选，N或留空=当前UTC)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

      # ==================== 开关（默认关闭） ====================
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      use_nomount:
        description: "启用 NoMount 挂载元模块"
        required: false
        type: boolean
        default: false
      use_networking:
        description: "启用网络增强（BBRv3 / IPSet / Qdisc / CIFS）"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链"
        required: false
        type: boolean
        default: false
      supp_op:
        description: "启用一加 8E 支持"
        required: false
        type: boolean
        default: false
      droidspaces_ntsync:
        description: "启用 Droidspaces 容器 NTSync 支持（需启用 Droidspaces）"
        required: false
        type: boolean
        default: false

jobs:
  resolve-version:
    runs-on: ubuntu-24.04
    outputs:
      android_version: ${{ steps.resolve.outputs.android_version }}
      sub_level: ${{ steps.resolve.outputs.sub_level }}
      kernel_full: ${{ steps.resolve.outputs.kernel_full }}
      os_patch_level: ${{ steps.resolve.outputs.os_patch_level }}
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
      - name: 检出版本数据
        uses: actions/checkout@v7

      - name: 解析安全补丁级别
        id: resolve
        env:
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          ANDROID_VERSION: ${{ inputs.android_version }}
          OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
          SUB_LEVEL: ${{ inputs.sub_level }}
          REVISION: ${{ inputs.revision }}
        run: |
          python3 scripts/workflow_inputs.py custom

  build-custom-kernel:
    name: "${{ needs.resolve-version.outputs.kernel_full }}-${{ needs.resolve-version.outputs.android_version }}-${{ inputs.os_patch_level }}"
    needs: resolve-version
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: ${{ needs.resolve-version.outputs.android_version }}
      kernel_version: ${{ inputs.kernel_version }}
      sub_level: ${{ needs.resolve-version.outputs.sub_level }}
      os_patch_level: ${{ needs.resolve-version.outputs.os_patch_level }}
      revision: ${{ needs.resolve-version.outputs.revision }}
      ksu_variant: ${{ (inputs.kernelsu_variant == 'ReSukiSU' && 'BakaSU' || inputs.kernelsu_variant) }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      use_nomount: ${{ inputs.use_nomount || false }}
      use_networking: ${{ inputs.use_networking || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ (inputs.ksu_mode == '禁用KSU' && '禁用KSU' || (inputs.cancel_susfs || inputs.ksu_mode == '禁用SUSFS') && '禁用SUSFS' || '关闭') != '禁用SUSFS' && (inputs.ksu_mode == '禁用KSU' && '禁用KSU' || (inputs.cancel_susfs || inputs.ksu_mode == '禁用SUSFS') && '禁用SUSFS' || '关闭') != '禁用KSU' }}
      ksu_mode: ${{ (inputs.ksu_mode == '禁用KSU' && '禁用KSU' || (inputs.cancel_susfs || inputs.ksu_mode == '禁用SUSFS') && '禁用SUSFS' || '关闭') || '关闭' }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}

  get-ksu-manager:
    needs: resolve-version
    if: ${{ (inputs.ksu_mode == '禁用KSU' && '禁用KSU' || (inputs.cancel_susfs || inputs.ksu_mode == '禁用SUSFS') && '禁用SUSFS' || '关闭') != '禁用KSU' }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ (inputs.kernelsu_variant == 'ReSukiSU' && 'BakaSU' || inputs.kernelsu_variant) }}
